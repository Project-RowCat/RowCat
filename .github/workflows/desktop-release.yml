# Builds the Windows installer of the desktop app (apps/desktop) and publishes it as a GitHub
# release.
#
# ```text
# git tag desktop-2026-10-31 && git push origin desktop-2026-10-31     ← the trigger
#         ↓
# plan     the tag is a real date · no release by that name yet · CI passed on this commit
# windows  install frozen → build api · web · admin → package (version 2026.10.31) → installer
# release  the repository's latest release, named by the date: the installer, its SHA-256, and the
#          update feed (latest.yml + the installer's blockmap) that installed copies read
# ```
#
# ## The date is the name
#
# A public release is called by its date (AGENTS.md §Versioning), so the tag is `desktop-<date>` and
# the release title is the date. The installer still needs `MAJOR.MINOR.PATCH` — electron-builder and
# Windows read nothing else — so the same date goes in as `YYYY.M.D`. That number is the build's
# identity, never what the page calls the release.
#
# **A release that went out is never replaced.** Installed copies update themselves to it, and an
# update is accepted only when its version is higher — a rebuild under the same date would reach no one
# who already took the first. A fix ships as the next date. So there is still one release per day; the
# tag is moved only for a release whose run failed before publishing.
#
# ## Two entries, and the difference is the event
#
# ```text
# push(desktop-*)     publishes
# workflow_dispatch   never publishes. the same gates and build; the installer is a run artifact
# ```
#
# The same reasoning as mcp-publish.yml: no input value can turn a rehearsal into a release.
#
# ## Only a commit CI passed on
#
# The suite is not run here. CI (ci.yml) runs it with its real services on every commit, and this
# release goes ahead only if that run passed on the tagged commit (scripts/ci-passed.sh).
#
# ## What this release is not
#
# * **Not signed.** Windows SmartScreen warns on the first run until a deployment signs the installer
#   with its own certificate (apps/desktop/README.md). The release notes say how to get past it. It is
#   still published as a full release, not a prerelease: installed copies find their update through
#   `/releases/latest`, which never answers with a prerelease (see the update feed below).
#
# ## The update feed
#
# Installed copies ask this repository's releases for a newer one (apps/desktop/src/updater.ts). The
# feed is the repository this workflow runs in — `GITHUB_REPOSITORY`, written into the installer's
# `app-update.yml` at packaging — so a fork's installers follow the fork's releases with nothing to edit.
# electron-builder writes `latest.yml` and the blockmap beside the installer; all three are attached
# under the names it gave them, because `latest.yml` points at the installer by name and a renamed file
# is a 404 for every copy that tries to update.
#
# Copies find the release through `github.com/<repo>/releases/latest` — the newest published release
# that is not a draft or a prerelease — and read that release's `latest.yml`. That is why this release
# is marked `--latest`, and why **this must stay the only workflow that publishes releases here**:
# whichever release is "latest" becomes every installed copy's update target, whatever its tag. (The
# releases feed `releases.atom` is not used because it also lists bare tags, such as `mcp-v*`.)
#
# The blockmap makes differential downloads possible from a copy's second update on. The first one is
# a full download: the updater finds the old blockmap by swapping the version inside the download URL,
# and these URLs carry the date (`2026-11-01`), not the version (`2026.11.1`).
# * **Windows only.** A macOS installer needs an Apple Developer ID and notarization before it opens
#   without a warning on another Mac; it is still built locally (`pnpm --filter @rowcat/desktop package`).
name: Desktop Release

on:
  push:
    tags: ["desktop-*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to rehearse (this run never publishes)
        type: string
        required: false

concurrency:
  group: rowcat-desktop-release
  cancel-in-progress: false

permissions:
  contents: read
  # scripts/ci-passed.sh reads CI's runs for the commit.
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      date: ${{ steps.plan.outputs.date }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # First, before anything slow: a tag that is not a date dies here.
      - name: Release plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            date="${REF_NAME#desktop-}"
            # `date -d` normalizes 2026-02-30 to March; only a date that survives the round trip is one.
            if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [ "$(date -u -d "$date" +%F 2>/dev/null)" != "$date" ]; then
              echo "::error::The tag must be desktop-YYYY-MM-DD with a real date, got ${REF_NAME}." >&2
              exit 1
            fi
          else
            # A rehearsal is stamped with today in the product timezone.
            date="$(TZ=Asia/Seoul date +%F)"
          fi
          IFS=- read -r year month day <<<"$date"
          version="$((10#$year)).$((10#$month)).$((10#$day))"
          {
            echo "date=$date"
            echo "version=$version"
            echo "sha=$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"
          echo "release ${date}, installer version ${version}"

      # A release by that name already exists — say so now rather than after half an hour of building.
      - name: Refuse to republish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release named ${GITHUB_REF_NAME} already exists. Installed copies may already have taken it; ship the fix as the next date." >&2
            exit 1
          fi

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-passed.sh "$(git rev-parse HEAD)" 60

  windows:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The runner checks text out with CRLF, and the build reads committed text it then ships — the
      # migrations the API hashes when it applies them among it. An installer built from a different
      # byte sequence than the one CI tested is not that commit.
      - run: git config --global core.autocrlf false && git config --global core.eol lf

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # No `version`: the action reads `packageManager` from the root package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # Frozen and uncached, as every release here: the installer is built from the tagged commit's
      # lockfile. On this runner it brings Windows' own native binaries (Postgres, sharp).
      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter=@rowcat/api --filter=web --filter=admin

      - run: pnpm --filter @rowcat/desktop run package "${{ needs.plan.outputs.version }}"

      # The installer is attached under the name electron-builder gave it (scripts/build-app.ts names
      # it by the date): `latest.yml` points at that name, so a rename breaks every update. What is
      # checked here is what an installed copy will read — a feed for this repository, this version,
      # and a file that exists.
      - name: Collect the release files
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          shopt -s nullglob
          cd apps/desktop/out
          built=(*.exe)
          if [ "${#built[@]}" -ne 1 ]; then
            echo "::error::Expected one installer in apps/desktop/out, found ${#built[@]}." >&2
            exit 1
          fi
          installer="${built[0]}"
          for file in latest.yml "${installer}.blockmap" win-unpacked/resources/app-update.yml; do
            [ -f "$file" ] || { echo "::error::${file} was not written; installed copies could not update." >&2; exit 1; }
          done
          grep -qx "version: ${VERSION}" latest.yml || { echo "::error::latest.yml does not carry version ${VERSION}." >&2; exit 1; }
          grep -qx "path: ${installer}" latest.yml || { echo "::error::latest.yml does not point at ${installer}." >&2; exit 1; }
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          grep -qx "owner: ${owner}" win-unpacked/resources/app-update.yml && grep -qx "repo: ${repo}" win-unpacked/resources/app-update.yml \
            || { echo "::error::app-update.yml does not name ${GITHUB_REPOSITORY}." >&2; exit 1; }
          mkdir -p ../../../release
          cp "$installer" "${installer}.blockmap" latest.yml ../../../release/
          (cd ../../../release && sha256sum "$installer" >"${installer}.sha256")
          ls -l ../../../release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rowcat-desktop-windows
          path: release/
          retention-days: 7
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [plan, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The one write in this workflow: creating the release and attaching the installer.
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rowcat-desktop-windows
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ needs.plan.outputs.date }}
        run: |
          installer="$(cd release && ls *.exe)"
          checksum="$(cut -d' ' -f1 "release/${installer}.sha256")"
          cat >notes.md <<EOF
          컴퓨터 한 대에서 RowCat을 통째로 돌리는 Windows 앱입니다. 터미널도 Docker도 필요 없습니다.

          ## 설치

          1. 아래 **${installer}** 를 받아 두 번 누릅니다. 설치는 내 계정에만 되고 관리자 권한을 묻지 않습니다.
          2. **서명되지 않은 설치 파일입니다.** Windows가 「Windows의 PC 보호」를 띄우면 **추가 정보 → 실행**을 누릅니다.
          3. 처음 열 때 1분쯤 준비합니다. 그다음에는 RowCat 창이 바로 열립니다.

          대화와 초안, 데이터베이스는 이 컴퓨터의 \`%APPDATA%\\RowCat\` 아래에 남습니다. 새 버전을 설치해도 그대로입니다.

          ## 업데이트

          설치한 앱은 새 릴리스를 스스로 받습니다. 다 받으면 앱을 끌 때 설치되고, RowCat 메뉴의 **다시 시작해서 업데이트**로 바로 설치할 수도 있습니다. RowCat 메뉴에 **업데이트 확인**이 없는 버전을 쓰고 있다면, 이번 한 번은 이 설치 파일을 직접 받아 설치합니다.

          ## 확인

          SHA-256: \`${checksum}\`

          이 빌드는 CI가 통과한 커밋에서 GitHub Actions의 Windows 러너로 만들었습니다. 자세한 내용은 [apps/desktop/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/apps/desktop/README.md)에 있습니다.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "데스크톱 ${DATE}" \
            --notes-file notes.md \
            "release/${installer}" "release/${installer}.sha256" \
            "release/${installer}.blockmap" "release/latest.yml"
