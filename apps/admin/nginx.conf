# Static serving for the operations console — one SPA.
#
# A file rather than a printf in the Dockerfile because three rules below need their reasons
# written down.

# CSP — all three blocks repeat it for the `add_header` inheritance reason below.
#   script-src 'self'         no scripts outside the bundle (no CDN loader)
#   style-src 'unsafe-inline' Tailwind 4 runtime and Base UI use inline style attributes
#   connect-src               the API origin is baked in by the VITE_API_ORIGIN build arg;
#                             the Dockerfile fills `__API_ORIGIN__` from the same arg
#                             (do not edit by hand: that makes two sources)
#   img-src https:            avatars and covers come from the API origin, which varies per deployment
server {
    listen 3002;
    root /usr/share/nginx/html;

    # A cached index keeps serving the old bundle after a deploy; unlike hashed assets its
    # address is fixed, so any freshness lifetime delays deploys by that much.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Hashed assets: the address is the content's identity, so one year immutable.
    #
    # Do not combine `expires` with `add_header Cache-Control` — that sends two
    # `Cache-Control` lines and which one wins varies by intermediate cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # SPA fallback: routing lives in the browser, so without it refresh, bookmarks and shared
    # links (operators passing each other a queue) all 404.
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers are repeated in every block: nginx's `add_header` inheritance is cut
        # entirely by any `add_header` at the inner level, so server-level headers silently
        # vanished from the cache-header locations (asset responses lost
        # `X-Content-Type-Options` once). `try_files` redirects internally to `= /index.html`,
        # so headers only here would miss the HTML response.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
